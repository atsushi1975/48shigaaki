<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>招集ツール</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF1F4;--sf:#FFFFFF;--sf2:#F4F7F9;--ink:#12202B;--mut:#5A6B78;--line:#D2DBE2;
  --move:#D2450A;--move-bg:#FFEDE0;--play:#1859C7;--play-bg:#E6EFFF;
  --ok:#0A7657;--ok-bg:#E1F5EC;--tbd:#7D6200;--tbd-bg:#FFF4CC;
  --team:#9B1B3E;--btn:#12202B;--btn-ink:#FFFFFF;--btn2:#E3E9EE;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1218;--sf:#151F29;--sf2:#1B2733;--ink:#E8EEF3;--mut:#93A4B2;--line:#2B3A47;
    --move:#FF8B4E;--move-bg:#3B2213;--play:#78AEFF;--play-bg:#14294A;
    --ok:#4FD3A2;--ok-bg:#11362A;--tbd:#F3CB50;--tbd-bg:#3A3110;
    --team:#FF8FA9;--btn:#E8EEF3;--btn-ink:#0B1218;--btn2:#243240;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1218;--sf:#151F29;--sf2:#1B2733;--ink:#E8EEF3;--mut:#93A4B2;--line:#2B3A47;
  --move:#FF8B4E;--move-bg:#3B2213;--play:#78AEFF;--play-bg:#14294A;
  --ok:#4FD3A2;--ok-bg:#11362A;--tbd:#F3CB50;--tbd-bg:#3A3110;
  --team:#FF8FA9;--btn:#E8EEF3;--btn-ink:#0B1218;--btn2:#243240;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);
  padding:8px 10px 8px;border-bottom:1px solid var(--line)}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.tabs{display:flex;flex:1;background:var(--btn2);border-radius:12px;padding:3px;gap:3px}
.tab{flex:1;min-height:40px;border-radius:9px;font-weight:700;font-size:15px}
.tab[aria-pressed="true"]{background:var(--sf);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.ibtn{min-width:48px;min-height:46px;border-radius:12px;background:var(--btn2);font-weight:700;font-size:14px;padding:0 10px}
.ibtn:disabled{opacity:.4}
.cb{display:grid;grid-template-columns:74px 1fr 46px 66px;gap:5px;align-items:stretch;margin-bottom:6px}
.cb .btn{min-height:46px;padding:0}
.cb:last-child{margin-bottom:0}
.cbpos{background:var(--sf);border:1px solid var(--line);border-radius:12px;text-align:center;padding:4px 2px;line-height:1.1}
.cbpos b{display:block;font-size:30px}
.cbpos small{font-size:11px;color:var(--mut)}
.cbnext{min-width:0;align-self:center;font-size:13px;line-height:1.3}
.cbnext .h{color:var(--mut);font-size:12px}
.cbnext b{display:block;font-size:15px;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
.cbnext i{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-style:normal;font-size:12px;line-height:1.25;color:var(--mut);white-space:normal;overflow-wrap:anywhere}
.btn{min-height:52px;border-radius:12px;background:var(--btn2);font-weight:700;padding:0 14px}
.btn.minus{padding:0;font-size:17px}
.btn.plus{background:var(--btn);color:var(--btn-ink);font-size:22px}
.btn.pri{background:var(--play);color:#fff}
.btn.win{background:var(--ok);color:#fff}
.btn.lose{background:var(--btn2)}
.btn.sel{outline:3px solid var(--play);outline-offset:-3px}
.btn.wide{display:block;width:100%}
.btn.danger{background:var(--move);color:#fff}
main{padding:10px 10px 40px;max-width:640px;margin:0 auto}
h2{font-size:15px;margin:18px 2px 8px;display:flex;align-items:baseline;gap:8px}
h2 small{font-weight:400;color:var(--mut);font-size:12.5px}
.card{background:var(--sf);border:1px solid var(--line);border-left:8px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.card.move{border-left-color:var(--move)}
.card.move .big{color:var(--move)}
.card.play{border-left-color:var(--play)}
.card.play .big{color:var(--play)}
.card.out,.card.champ{opacity:.7}
.card.move{box-shadow:0 0 0 2px var(--move) inset}
.who{font-weight:800;font-size:18px;line-height:1.3}
.ev{color:var(--mut);font-size:12.5px}
.big{font-size:24px;font-weight:800;line-height:1.25;margin:4px 0 2px}
.sub{font-size:13.5px;color:var(--mut)}
.sub b{color:var(--ink)}
.row{display:flex;gap:8px;margin-top:8px}
.row>.btn{flex:1}
.tm{color:var(--team);font-weight:700}
.tbd{color:var(--tbd);background:var(--tbd-bg);border-radius:6px;padding:0 6px;font-weight:700;font-size:.92em}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--btn2)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.mv{background:var(--move-bg);color:var(--move)}
.chip.pl{background:var(--play-bg);color:var(--play)}
.list{background:var(--sf);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);min-height:48px;width:100%;text-align:left}
.li:first-child{border-top:0}
.li .l{min-width:0}
.li .r{white-space:nowrap;color:var(--mut);font-size:13px;text-align:right}
.li.done{opacity:.5}
.li.cur{background:var(--play-bg)}
.qh{font-size:12.5px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);padding:2px 4px}
.empty{padding:14px;color:var(--mut);text-align:center;font-size:14px}
.sheetwrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheetwrap[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;
  padding:14px 12px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .sec{margin-top:16px}
.sheet .sec>label,.sheet .lbl{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.side{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.side.w{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
input[type=text],input[type=number],select,textarea{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--sf);padding:8px 10px}
textarea{min-height:90px;font-size:12px;word-break:break-all}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;gap:8px}
.step .btn{min-width:52px}
.step b{min-width:44px;text-align:center;font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;margin:0 6px 6px 0}
.pill button{min-width:34px;min-height:34px;border-radius:50%;background:var(--btn2)}
.close{position:sticky;bottom:0}
.small{font-size:12.5px;color:var(--mut)}
</style>
</head>

<main id="main"></main>
<div class="sheetwrap" id="sheet" hidden></div>

function shareSnapshot(){

}
function applyShare(data){
  if(!data||!Array.isArray(data.days))return;
  data.days.forEach(function(x,i){
    if(!S.d[i]||!x)return;
    S.d[i].pos=x.pos||zeroPos();S.d[i].res=x.res||{};S.d[i].rp=x.rp||{};S.d[i].refAsg=x.refAsg||{};S.d[i].courts=x.courts||defCourts();
  });
  if(data.rev)S.sync.rev=data.rev;
}
function syncUrl(){return S.sync.url.replace(/\/$/,'')+'/'+encodeURIComponent(S.sync.room||'room')+'.json'}
function syncReady(){return S.sync.on&&S.sync.url&&S.sync.room}
var pushTimer=null,pullTimer=null,syncBusy=false;
function refreshLite(){renderTop();renderMain()}
function noteSync(err){S.sync.err=err||'';S.sync.last=new Date().toLocaleTimeString();try{window.localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(ui.sheet&&ui.sheet.t==='settings')renderSheet();}
function schedulePush(){
  if(!syncReady())return;
  clearTimeout(pushTimer);pushTimer=setTimeout(doPush,700);
}
function doPush(){
  if(!syncReady())return;
  var snap=shareSnapshot();S.sync.rev=snap.rev;
  fetch(syncUrl(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(snap)})
    .then(function(r){if(!r.ok)throw new Error('送信エラー(HTTP '+r.status+')');noteSync('')})
    .catch(function(e){noteSync(String(e&&e.message||e))});
}
function doPull(force){
  if(!syncReady()||syncBusy)return;
  syncBusy=true;
  fetch(syncUrl(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('取得エラー(HTTP '+r.status+')');return r.json()})
    .then(function(data){
      syncBusy=false;
      if(data&&data.rev&&(force||data.rev>S.sync.rev)){applyShare(data);save();refreshLite()}
      else if(force&&!(data&&data.rev)){doPush()}
      noteSync('');
    })
    .catch(function(e){syncBusy=false;noteSync(String(e&&e.message||e))});
}
function ensurePull(){
  clearInterval(pullTimer);
  if(syncReady())pullTimer=setInterval(doPull,25000);
}

  var ck=bk+':'+(-sl),r=S.d[di].res[ck];

  return occ(di,ck,r);
}

    var st=status(di,tr),du=dutyOf(di,tr,st),tn=tr.names.filter(function(n){return tr.T[n]});
    tr.names.forEach(function(n){
      if(!tr.T[n])return;
      var p=per[n]||(per[n]={name:n,ok:true,min:Infinity,busy:false,duty:0,share:[],grp:''});
      if(st.st==='play'){p.ok=false;p.busy=true}
      else if(st.st==='move'||st.st==='wait'){
        if(st.remain<p.min)p.min=st.remain;
        if(st.remain<2*st.c)p.ok=false;
      }
      if(du){
        p.duty=Math.max(p.duty,du.left);p.dutyElapsed=du.elapsed;
        if(du.one&&tn.length>=2)p.share.push({names:tn,left:du.left});
        else p.ok=false;
      }
    });
  });
  /* 手動で審判を指定した人は、その試合の結果が出るまでストックから外す */
  var RA=S.d[di].refAsg||{};
  Object.keys(RA).forEach(function(key){
    var nm=RA[key],p=per[nm];
    if(p){p.ok=false;p.busy=true;p.refKey=key}
  });
  var list=Object.keys(per).map(function(n){return per[n]});
  list.forEach(function(p){
    if(!p.ok)return;
    p.share.forEach(function(g){
      var allOk=g.names.every(function(m){return per[m]&&per[m].ok});
      if(allOk){p.grp=g.names.join('または');p.grpLeft=g.left}
      else{p.ok=false;p.duty=Math.max(p.duty,g.left)}
    });
  });
  return list;
}
function participantsOf(di,k,T){
  var out={};
  [0,1].forEach(function(sd){
    var o=occ(di,k,sd);
    if(o&&o.bk!==undefined)DATA.br[o.bk].e[o.e][0].forEach(function(n){if(T[n])out[n]=1});
  });
  return out;
}
function refCandidates(di,k){
  var T=teamSet(),all=referees(di),part=participantsOf(di,k,T),RA=S.d[di].refAsg||{},cur=RA[k],out=[];
  Object.keys(T).forEach(function(n){
    if(part[n])return; /* 当事者本人は不可 */
    var p=all.filter(function(x){return x.name===n})[0];
    var elsewhere=null;Object.keys(RA).forEach(function(kk){if(RA[kk]===n&&kk!==k)elsewhere=kk});
    if(elsewhere)return; /* 別の試合の審判に指定済み */
    if(p&&p.busy&&n!==cur)return; /* 試合中(このk用の指定でなければ除外) */
    var tag='';
    if(n===cur)tag='現在指定中';
    else if(p&&p.duty>0)tag='敗退後'+(p.dutyElapsed||0)+'試合目';
    else if(p&&!p.ok&&p.min<Infinity)tag='次まであと'+p.min+'試合';
    out.push({name:n,tag:tag,cur:n===cur});
  });
  out.sort(function(a,b){return (b.cur?1:0)-(a.cur?1:0)});
  return out;
}
function leavesOf(bk,sl){
  if(sl>=0)return [sl];
  var m=DATA.br[bk].m[-sl];
  return leavesOf(bk,m[0]).concat(leavesOf(bk,m[1]));
}

    delete S.d[di].res[bk+':'+p];delete S.d[di].rp[bk+':'+p];delete S.d[di].refAsg[bk+':'+p];
    n=p;
  }
}

    case 'jump':ui.sheet={t:'jump',sy:arg};render();break;
    case 'settings':ui.msg='';ui.resetArm=0;ui.sheet={t:'settings'};render();break;
    case 'close':sheetHide();break;
    case 'match':ui.sheet={t:'match',k:arg};render();break;
    case 'refpick':ui.sheet={t:'refpick',k:arg};render();break;
    case 'refassign':
      p=arg.split('|');var rk=p[0],rn=p.slice(1).join('|');
      mut(function(){D().refAsg[rk]=rn});sheetHide();break;
    case 'refclear':mut(function(){delete D().refAsg[arg]});sheetHide();break;
    case 'back':ui.sheet={t:'match',k:arg};render();break;
    case 'res':p=arg.split('|');setRes(p[0],+p[1]);break;
    case 'callto':mut(function(){var pi=DAYIDX[S.day].idx[arg];setPos(pi[0],pi[1]+1)});sheetHide();break;
    case 'assign':p=arg.split('|');ui.sheet={t:'assign',k:p[0],side:+p[1]};render();break;
    case 'pick':p=arg.split('|');mut(function(){D().asg[p[0]+'|'+p[1]]={e:+p[2],b:p[3]}});ui.sheet={t:'match',k:p[0]};render();break;
    case 'asgtxt':
      p=arg.split('|');var tv=($('#asgtxt').value||'').trim();
      if(tv){mut(function(){D().asg[p[0]+'|'+p[1]]={t:tv}});ui.sheet={t:'match',k:p[0]};render()}
      break;
    case 'unasg':p=arg.split('|');mut(function(){delete D().asg[p[0]+'|'+p[1]]});ui.sheet={t:'match',k:p[0]};render();break;
    case 'jn':
      var nv=parseInt($('#jn').value,10);
      if(!isNaN(nv)){mut(function(){setPos(arg,nv)});sheetHide()}
      break;
    case 'jm':
      var b=$('#jb').value,m=parseInt($('#jm').value,10),key=b+':'+m,ix=DAYIDX[S.day].idx[key];
      if(ix&&ix[0]===arg){mut(function(){setPos(arg,ix[1]+1)});sheetHide()}
      else{ui.jmsg='その試合番号はない';var e2=$('#jm');if(e2){e2.value='';e2.placeholder='その番号はない'}}
      break;
    case 'court':p=arg.split('|');mut(function(){D().courts[p[0]]=Math.max(1,Math.min(40,D().courts[p[0]]+(+p[1])))});break;
    case 'team':
      var tn=($('#tname').value||'').trim();
      if(tn){mut(function(){S.team=tn})}
      break;
    case 'add':mut(function(){var i=S.rm.indexOf(arg);if(i>=0)S.rm.splice(i,1);if(S.add.indexOf(arg)<0)S.add.push(arg)});break;
    case 'rm':mut(function(){var i=S.add.indexOf(arg);if(i>=0)S.add.splice(i,1);if(S.rm.indexOf(arg)<0)S.rm.push(arg)});break;
    case 'unrm':mut(function(){var i=S.rm.indexOf(arg);if(i>=0)S.rm.splice(i,1)});break;
    case 'theme':S.theme=arg;save();render();break;
    case 'syncon':
      S.sync.on=!S.sync.on;save();ensurePull();
      if(S.sync.on&&S.sync.url&&S.sync.room)doPull();
      renderSheet();
      break;
    case 'syncsave':
      S.sync.url=($('#syncurl').value||'').trim();S.sync.room=($('#syncroom').value||'').trim();
      save();ensurePull();if(S.sync.on)doPull();
      renderSheet();
      break;
    case 'syncnow':
      S.sync.url=($('#syncurl').value||'').trim();S.sync.room=($('#syncroom').value||'').trim();
      save();ensurePull();
      if(S.sync.on)doPull(true);
      renderSheet();
      break;
    case 'export':
      ui.code=encode();ui.msg='コピーして保存。読み込むときはここに貼る。';
      renderSheet();
      var ta=$('#code');
      if(ta){ta.focus();ta.select();try{document.execCommand('copy')}catch(e){}}
      break;
    case 'import':
      try{
        var s=decode($('#code').value);
        S=s;hist=[];save();ui.msg='読み込めた';ui.code='';render();
      }catch(er){ui.msg='読み込めない: '+er.message;ui.code=$('#code').value;renderSheet()}
      break;
    case 'reset':
      if(ui.resetArm){
        mut(function(){S.d[S.day]={pos:zeroPos(),courts:clone(D().courts),res:{},asg:{},rp:{},refAsg:{}}});
        ui.resetArm=0;sheetHide();
      }else{
        ui.resetArm=1;renderSheet();
        setTimeout(function(){if(ui.resetArm){ui.resetArm=0;if(ui.sheet&&ui.sheet.t==='settings')renderSheet()}},4000);
      }
      break;
  }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='sq'){
    ui.sq=ev.target.value;
    var r=$('#sres');if(r)r.innerHTML=searchHTML(ui.sq);
  }
});
render();
window.__kj={get S(){return S},render:render,encode:encode,decode:decode,tracks:tracks,status:status,referees:referees,DATA:DATA};
})();
</script>
</body>
</html>
