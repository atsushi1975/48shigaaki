<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>招集ツール</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF1F4;--sf:#FFFFFF;--sf2:#F4F7F9;--ink:#12202B;--mut:#5A6B78;--line:#D2DBE2;
  --move:#D2450A;--move-bg:#FFEDE0;--play:#1859C7;--play-bg:#E6EFFF;
  --ok:#0A7657;--ok-bg:#E1F5EC;--tbd:#7D6200;--tbd-bg:#FFF4CC;
  --team:#9B1B3E;--btn:#12202B;--btn-ink:#FFFFFF;--btn2:#E3E9EE;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1218;--sf:#151F29;--sf2:#1B2733;--ink:#E8EEF3;--mut:#93A4B2;--line:#2B3A47;
    --move:#FF8B4E;--move-bg:#3B2213;--play:#78AEFF;--play-bg:#14294A;
    --ok:#4FD3A2;--ok-bg:#11362A;--tbd:#F3CB50;--tbd-bg:#3A3110;
    --team:#FF8FA9;--btn:#E8EEF3;--btn-ink:#0B1218;--btn2:#243240;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1218;--sf:#151F29;--sf2:#1B2733;--ink:#E8EEF3;--mut:#93A4B2;--line:#2B3A47;
  --move:#FF8B4E;--move-bg:#3B2213;--play:#78AEFF;--play-bg:#14294A;
  --ok:#4FD3A2;--ok-bg:#11362A;--tbd:#F3CB50;--tbd-bg:#3A3110;
  --team:#FF8FA9;--btn:#E8EEF3;--btn-ink:#0B1218;--btn2:#243240;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);
  padding:8px 10px 8px;border-bottom:1px solid var(--line)}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ibtn{min-width:48px;min-height:46px;border-radius:12px;background:var(--btn2);font-weight:700;font-size:14px;padding:0 10px}
.ibtn:disabled{opacity:.4}
.cb{display:grid;grid-template-columns:74px 1fr 46px 66px;gap:5px;align-items:stretch}
.cbpos{background:var(--sf);border:1px solid var(--line);border-radius:12px;text-align:center;padding:4px 2px;line-height:1.1}
.cbpos b{display:block;font-size:30px}
.cbpos small{font-size:11px;color:var(--mut)}
.cbnext{min-width:0;align-self:center;font-size:13px;line-height:1.3}
.cbnext .h{color:var(--mut);font-size:12px}
.cbnext b{display:block;font-size:15px;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
.cbnext i{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-style:normal;font-size:12px;line-height:1.25;color:var(--mut);white-space:normal;overflow-wrap:anywhere}
.btn{min-height:52px;border-radius:12px;background:var(--btn2);font-weight:700;padding:0 14px}
.btn.minus{padding:0;font-size:17px}
.btn.plus{background:var(--btn);color:var(--btn-ink);font-size:22px}
.btn.pri{background:var(--play);color:#fff}
.btn.win{background:var(--ok);color:#fff}
.btn.lose{background:var(--btn2)}
.btn.sel{outline:3px solid var(--play);outline-offset:-3px}
.btn.wide{display:block;width:100%}
.btn.danger{background:var(--move);color:#fff}
.btn.sm{min-height:38px;padding:0 10px;font-size:13px;font-weight:600}
main{padding:10px 10px 40px;max-width:640px;margin:0 auto}
h2{font-size:15px;margin:18px 2px 8px;display:flex;align-items:baseline;gap:8px}
h2 small{font-weight:400;color:var(--mut);font-size:12.5px}
.card{background:var(--sf);border:1px solid var(--line);border-left:8px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.card.move{border-left-color:var(--move);box-shadow:0 0 0 2px var(--move) inset}
.card.move .big{color:var(--move)}
.card.play{border-left-color:var(--play)}
.card.play .big{color:var(--play)}
.card.out,.card.champ,.card.over{opacity:.75}
.card.pend{border-left-color:var(--tbd)}
.who{font-weight:800;font-size:18px;line-height:1.3}
.ev{color:var(--mut);font-size:12.5px}
.big{font-size:22px;font-weight:800;line-height:1.25;margin:4px 0 2px}
.sub{font-size:13.5px;color:var(--mut)}
.sub b{color:var(--ink)}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:70px}
.tm{color:var(--team);font-weight:700}
.tbd{color:var(--tbd);background:var(--tbd-bg);border-radius:6px;padding:0 6px;font-weight:700;font-size:.92em}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--btn2)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.mv{background:var(--move-bg);color:var(--move)}
.chip.pl{background:var(--play-bg);color:var(--play)}
.list{background:var(--sf);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);min-height:48px;width:100%;text-align:left}
.li:first-child{border-top:0}
.li .l{min-width:0}
.li .r{white-space:nowrap;color:var(--mut);font-size:13px;text-align:right}
.li.done{opacity:.5}
.li.cur{background:var(--play-bg)}
.qh{font-size:12.5px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);padding:2px 4px}
.empty{padding:14px;color:var(--mut);text-align:center;font-size:14px}
.sheetwrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheetwrap[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;
  padding:14px 12px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .sec{margin-top:16px}
.sheet .sec>label,.sheet .lbl{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.side{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
input[type=text],input[type=number],select,textarea{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--sf);padding:8px 10px}
textarea{min-height:90px;font-size:12px;word-break:break-all}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;align-items:center;gap:8px}
.step .btn{min-width:52px}
.step b{min-width:44px;text-align:center;font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;margin:0 6px 6px 0}
.pill button{min-width:34px;min-height:34px;border-radius:50%;background:var(--btn2)}
.close{position:sticky;bottom:0}
.small{font-size:12.5px;color:var(--mut)}
table.rr{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.rr th,table.rr td{border:1px solid var(--line);padding:5px 6px;text-align:center}
table.rr th{background:var(--sf2);font-weight:700}
table.rr td.name{text-align:left;font-weight:700}
</style>
</head>

function shareSnapshot(){return {rev:Date.now(),pos:S.pos,courts:S.courts,rank:S.rank,adv:S.adv,oppOv:S.oppOv}}
function applyShare(d){
  if(!d)return;
  if(typeof d.pos==='number')S.pos=d.pos;
  if(typeof d.courts==='number')S.courts=d.courts;
  if(d.rank)S.rank=d.rank;if(d.adv)S.adv=d.adv;if(d.oppOv)S.oppOv=d.oppOv;
  if(d.rev)S.sync.rev=d.rev;

var pushTimer=null,pullTimer=null,syncBusy=false;

function noteSync(err){S.sync.err=err||'';S.sync.last=new Date().toLocaleTimeString();try{window.localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(ui.sheet&&ui.sheet.t==='settings')renderSheet();}
function schedulePush(){if(!syncReady())return;clearTimeout(pushTimer);pushTimer=setTimeout(doPush,700)}
function doPush(){
  if(!syncReady())return;
  var snap2=shareSnapshot();S.sync.rev=snap2.rev;
  fetch(syncUrl(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(snap2)})
    .then(function(r){if(!r.ok)throw new Error('送信エラー(HTTP '+r.status+')');noteSync('')})
    .catch(function(e){noteSync(String(e&&e.message||e))});
}
function doPull(){
  if(!syncReady()||syncBusy)return;
  syncBusy=true;
  fetch(syncUrl(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('取得エラー(HTTP '+r.status+')');return r.json()})
    .then(function(data){
      syncBusy=false;
      if(data&&data.rev&&data.rev>S.sync.rev){applyShare(data);save();refreshLite()}
      noteSync('');
    })
    .catch(function(e){syncBusy=false;noteSync(String(e&&e.message||e))});
}
function ensurePull(){clearInterval(pullTimer);if(syncReady())pullTimer=setInterval(doPull,25000)}

function teamSet(){

    var key=e.name+'|'+e.bk;if(seen[key])return;seen[key]=1;

  });

}
function searchHTML(q){
  q=(q||'').replace(/[\s\u3000]+/g,'');

  var T=teamSet(),seen={},out=[];

    if(n.indexOf(q)>=0&&!seen[n]&&out.length<8){seen[n]=1;var affs=Object.keys(NAMEAFF[n]);out.push([n,affs.join('/')])}

/* ---------- player progress (league -> rank -> advancement threads) ---------- */
function leagueCurrent(pl){
  var B=DATA.blocks[pl.block],myCodes=B.codes.filter(function(c){return B.pairs[c].indexOf(pl.idx)>=0});
  var upcoming=myCodes.filter(function(c){return QPOS[c]!==undefined&&QPOS[c]>=S.pos});
  if(!upcoming.length)return null;
  upcoming.sort(function(a,b){return QPOS[a]-QPOS[b]});
  var code=upcoming[0],pr=B.pairs[code],oppIdx=pr[0]===pl.idx?pr[1]:pr[0],opp=B.entrants[oppIdx];
  return {code:code,oppName:opp[0],oppAff:opp[1],st:statusOf(code,S.courts)};
}
function leagueAllDone(pl){
  var B=DATA.blocks[pl.block],myCodes=B.codes.filter(function(c){return B.pairs[c].indexOf(pl.idx)>=0});
  return myCodes.every(function(c){return QPOS[c]===undefined||QPOS[c]<S.pos});
}
function threadsFor(bk){
  // returns array of threads; each thread = array of stage {code,opp,res}
  var B=DATA.blocks[bk],rk=S.rank[bk];
  if(!rk)return null;
  var seed=B.next[String(rk)];
  if(!seed)return [];
  var seedList=Array.isArray(seed)?seed:[seed];
  var stored=S.adv[bk]; // array of threads, each thread array of {code,res}
  if(!stored){
    stored=seedList.map(function(s){return [{code:s.code,opp:s.opp}]});
  }
  return stored.map(function(thread){
    return thread.map(function(st){
      return {code:st.code,opp:S.oppOv[st.code]||st.opp||'未確定',res:S.adv[bk]?undefined:undefined,_raw:st};
    });
  });
}
function chainsFor(bk,rk){return (DATA.blocks[bk].next||{})[String(rk)]||null} // array of thread-chains (each: ordered [{code,opp}...])
function getAdv(bk){
  if(!S.adv[bk]){
    var rk=S.rank[bk];if(!rk)return null;
    var chains=chainsFor(bk,rk);if(!chains)return [];
    S.adv[bk]=chains.map(function(ch){return [{code:ch[0].code,opp:ch[0].opp,res:null}]});
  }
  return S.adv[bk];
}
/* 決勝トーナメントの番号どおりに、勝てば自動で次の試合へ進める。番組にない先(交流戦の続き等)は手動選択にフォールバック */
function autoAdvanceIfKnown(bk,ti){
  var rk=S.rank[bk],chains=chainsFor(bk,rk);if(!chains)return false;
  var chain=chains[ti];if(!chain)return false;
  var th=S.adv[bk][ti];
  if(th.length<chain.length){
    var nx=chain[th.length];
    th.push({code:nx.code,opp:nx.opp,res:null});
    return true;
  }
  return false; // チェーンを使い切った(番組上ここまでしか分からない)
}
function usedCodesGlobal(){
  var used={};
  Object.keys(S.adv).forEach(function(bk){S.adv[bk].forEach(function(th){th.forEach(function(st){used[st.code]=1})})});
  return used;
}
function candidateCodes(prefix){
  var used=usedCodesGlobal();
  return Q.filter(function(m){return prefixOf(m.k)===prefix&&!CODE2BLOCK[m.k]&&!used[m.k]}).map(function(m){return m.k});
}
function playerState(pl){
  if(!leagueAllDone(pl)){
    var cur=leagueCurrent(pl);
    if(cur)return {kind:'rr',label:DATA.blocks[pl.block].label,cur:cur};
  }
  var bk=pl.block,rk=S.rank[bk];
  if(!rk)return {kind:'rankwait',bk:bk,label:DATA.blocks[pl.block].label,size:DATA.blocks[bk].entrants.length};
  var threads=getAdv(bk);
  if(!threads.length)return {kind:'over',bk:bk,label:DATA.blocks[pl.block].label,rank:rk};
  return {kind:'adv',bk:bk,label:DATA.blocks[pl.block].label,rank:rk,threads:threads};
}
function rankOrder(ps){
  if(ps.kind==='rr'){
    var st=ps.cur.st;if(!st)return 9;
    if(st.st==='move')return 0;if(st.st==='play')return 1;return 3+((st.remain||0)/1000);
  }
  if(ps.kind==='adv'){
    var best=9,anyOpen=false;
    ps.threads.forEach(function(th){
      var last=th[th.length-1];
      if(last.res)return; // resolved thread, not urgent
      anyOpen=true;
      var st=statusOf(last.code,S.courts);
      var v=!st?8:(st.st==='move'?0:st.st==='play'?1:3+((st.remain||0)/1000));
      if(v<best)best=v;
    });
    return anyOpen?best:5;
  }
  if(ps.kind==='rankwait')return 2;
  return 6;
}

  h+='<button class="btn sm" data-act="setrank" data-arg="'+bk+'|0">未定</button></div>';
  return h;
}
function pickNextHTML(bk,ti,prefix){
  var cands=candidateCodes(prefix),id='nx_'+bk.replace(/[^a-zA-Z0-9]/g,'')+'_'+ti;
  var h='<div class="row" style="margin-top:6px"><select id="'+id+'" style="flex:1 1 auto">';

  h+='<div class="row"><input type="text" id="'+id+'_t" placeholder="一覧にない場合はコードを手入力"></div>';

  return h;

function cardHTML(pl,ps){
  var who='<span class="tm">'+esc(pl.name)+'</span>';
  if(ps.kind==='rr'){
    var st=ps.cur.st,h='<div class="card '+(st?st.st:'')+'"><div class="who">'+who+'</div><div class="ev">'+esc(ps.label)+' 予選リーグ</div>';
    if(!st){h+='<div class="big">キュー外</div></div>';return h}
    var big;
    if(st.st==='play')big='招集済・試合中';
    else if(st.st==='move')big=(st.remain===0?'次コール！':'招集場所へ移動')+'<span class="small"> あと'+st.remain+'試合</span>';
    else big='あと'+st.remain+'試合';

    h+='</div>';

  }

    var h2='<div class="card pend"><div class="who">'+who+'</div><div class="ev">'+esc(ps.label)+' 予選リーグ終了</div>';
    h2+='<div class="big">リーグ順位待ち</div><div class="sub">大会側の発表を見て、この選手の順位をタップで確定して</div>';
    h2+=rankPickerHTML(ps.bk,ps.size);

    return '<div class="card over"><div class="who">'+who+'</div><div class="ev">'+esc(ps.label)+'</div><div class="big">'+ps.rank+'位で本日の試合終了</div>'+

  }

      if(last.res==='win'&&/決勝$/.test(last.code)){

        h3+='<div class="row"><button class="btn sm" data-act="advundo" data-arg="'+ps.bk+'|'+ti+'">直前の結果を取消</button></div>';
      }else if(last.res==='win'){
        h3+='<div class="big">'+esc(last.code)+' 勝ち！</div>';
        h3+='<div class="sub">番組にこの先の対戦がないので、次の試合が分かったら選んで</div>';
        h3+=pickNextHTML(ps.bk,ti,prefixOf(last.code));
        h3+='<div class="row"><button class="btn sm" data-act="advundo" data-arg="'+ps.bk+'|'+ti+'">直前の結果を取消</button></div>';
      }else if(last.res==='lose'){

        h3+='<div class="row"><button class="btn sm" data-act="advundo" data-arg="'+ps.bk+'|'+ti+'">直前の結果を取消</button></div>';
      }else if(!st){

        h3+='<div class="row"><button class="btn win" data-act="advres" data-arg="'+ps.bk+'|'+ti+'|win">勝ち</button><button class="btn lose" data-act="advres" data-arg="'+ps.bk+'|'+ti+'|lose">負け</button></div>';
      }else{
        var big2;
        if(st.st==='play')big2='招集済・試合中';
        else if(st.st==='move')big2=(st.remain===0?'次コール！':'招集場所へ移動')+'<span class="small"> あと'+st.remain+'試合</span>';
        else big2='あと'+st.remain+'試合';

      }

    });

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest?ev.target.closest('[data-act]'):null;
  if(!el){if(ev.target.id==='sheet'){sheetHide()}return}
  var act=el.getAttribute('data-act'),arg=el.getAttribute('data-arg')||'';
  var p;
  switch(act){
    case 'undo':undo();break;
    case 'inc':mut(function(){setPos(S.pos+1)});break;
    case 'dec':mut(function(){setPos(S.pos-1)});break;
    case 'more':ui.qmore+=30;render();break;
    case 'jump':ui.sheet={t:'jump'};render();break;
    case 'settings':ui.msg='';ui.resetArm=0;ui.sheet={t:'settings'};render();break;
    case 'close':sheetHide();break;
    case 'qrow':ui.sheet={t:'qrow',k:arg};render();break;
    case 'oppedit':ui.sheet={t:'oppedit',k:arg};render();break;
    case 'setrank':
      p=arg.split('|');var bk=p[0],rk=+p[1];
      mut(function(){if(rk===0){delete S.rank[bk];delete S.adv[bk]}else{S.rank[bk]=rk;delete S.adv[bk]}});
      break;
    case 'rankclear':mut(function(){delete S.rank[arg];delete S.adv[arg]});break;
    case 'advres':
      p=arg.split('|');var bk2=p[0],ti2=+p[1],res=p[2];
      mut(function(){
        var th=getAdv(bk2)[ti2];th[th.length-1].res=res;
        if(res==='win')autoAdvanceIfKnown(bk2,ti2);
      });
      break;
    case 'advundo':
      p=arg.split('|');var bk3=p[0],ti3=+p[1];
      mut(function(){
        var th=getAdv(bk3)[ti3];
        if(th.length>1){delete S.oppOv[th[th.length-1].code];th.pop();th[th.length-1].res=null}
        else th[0].res=null;
      });
      break;
    case 'advset':
      p=arg.split('|');var bk4=p[0],ti4=+p[1],selId=p[2];
      var sel=$('#'+selId),txt=$('#'+selId+'_t');
      var code=(txt&&txt.value.trim())||(sel&&sel.value)||'';
      if(code){
        mut(function(){
          var th=getAdv(bk4)[ti4];
          th.push({code:code,opp:'未確定(手動選択)',res:null});
        });
      }
      break;
    case 'oppsave2':
      var ov2=($('#oppin2')&&$('#oppin2').value||'').trim();
      mut(function(){if(ov2)S.oppOv[ui.sheet.k]=ov2;else delete S.oppOv[ui.sheet.k]});
      sheetHide();break;
    case 'oppclear':mut(function(){delete S.oppOv[arg]});sheetHide();break;
    case 'callto':mut(function(){setPos(QPOS[arg]+1)});sheetHide();break;
    case 'jn':
      var nv=parseInt($('#jn').value,10);
      if(!isNaN(nv)){mut(function(){setPos(nv)});sheetHide()}
      break;
    case 'jk':
      var kk=($('#jk').value||'').trim();
      if(QPOS[kk]!==undefined){mut(function(){setPos(QPOS[kk]+1)});sheetHide()}
      else{ui.jmsg='その試合コードは見つからない';renderSheet()}
      break;
    case 'court':mut(function(){S.courts=Math.max(1,Math.min(40,S.courts+(+arg)))});break;
    case 'team':
      var tn=($('#tname').value||'').trim();
      if(tn)mut(function(){S.team=tn});
      break;
    case 'add':mut(function(){var i=S.rm.indexOf(arg);if(i>=0)S.rm.splice(i,1);if(S.add.indexOf(arg)<0)S.add.push(arg)});break;
    case 'rm':mut(function(){var i=S.add.indexOf(arg);if(i>=0)S.add.splice(i,1);if(S.rm.indexOf(arg)<0)S.rm.push(arg)});break;
    case 'unrm':mut(function(){var i=S.rm.indexOf(arg);if(i>=0)S.rm.splice(i,1)});break;
    case 'theme':S.theme=arg;save();render();break;
    case 'syncon':
      S.sync.on=!S.sync.on;save();ensurePull();
      if(S.sync.on&&S.sync.url&&S.sync.room)doPull();
      renderSheet();
      break;
    case 'syncsave':
      S.sync.url=($('#syncurl').value||'').trim();S.sync.room=($('#syncroom').value||'').trim();
      save();ensurePull();if(S.sync.on)doPull();
      renderSheet();
      break;
    case 'syncnow':
      S.sync.url=($('#syncurl').value||'').trim();S.sync.room=($('#syncroom').value||'').trim();
      save();ensurePull();
      if(S.sync.on){doPull();doPush()}
      renderSheet();
      break;
    case 'export':
      ui.code=encode();ui.msg='コピーして保存。読み込むときはここに貼る。';
      renderSheet();
      var ta=$('#code');
      if(ta){ta.focus();ta.select();try{document.execCommand('copy')}catch(e){}}
      break;
    case 'import':
      try{var s=decode($('#code').value);S=s;hist=[];save();ui.msg='読み込めた';ui.code='';render()}
      catch(er){ui.msg='読み込めない: '+er.message;ui.code=$('#code').value;renderSheet()}
      break;
    case 'reset':
      if(ui.resetArm){mut(function(){var team=S.team;S=defaultState();S.team=team});ui.resetArm=0;sheetHide()}
      else{ui.resetArm=1;renderSheet();setTimeout(function(){if(ui.resetArm){ui.resetArm=0;if(ui.sheet&&ui.sheet.t==='settings')renderSheet()}},4000)}
      break;
  }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='sq'){ui.sq=ev.target.value;var r=$('#sres');if(r)r.innerHTML=searchHTML(ui.sq)}
});
render();
window.__ng={get S(){return S},render:render,DATA:DATA,playerState:playerState,trackedPlayers:trackedPlayers,candidateCodes:candidateCodes,getAdv:getAdv};
})();
</script>
</body>
</html>
